version: 2
updates:
  - package-ecosystem: "terraform"
    directories:
      - "/modules/cloudflare/auth"
      - "/modules/cloudflare/dns"
      - "/modules/cloudflare/redirect"
      - "/modules/hetzner/firewall"
      - "/modules/hetzner/network"
      - "/modules/hetzner/object-storage"
      - "/modules/hetzner/server-stateful"
      - "/modules/hetzner/server-stateless"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:50"
      timezone: "Europe/Madrid"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:50"
      timezone: "Europe/Madrid"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:50"
      timezone: "Europe/Madrid"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
