version: 2
multi-ecosystem-groups:
  repository-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: 09:50
      timezone: Europe/Madrid
    commit-message:
      prefix: chore(deps)
updates:
  - package-ecosystem: terraform
    directories:
      - /modules/cloudflare/auth
      - /modules/cloudflare/dns
      - /modules/cloudflare/redirect
      - /modules/hetzner/firewall
      - /modules/hetzner/network
      - /modules/hetzner/object-storage
      - /modules/hetzner/server-stateful
      - /modules/hetzner/server-stateless
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    patterns:
      - "*"
    multi-ecosystem-group: repository-dependencies
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    patterns:
      - "*"
    multi-ecosystem-group: repository-dependencies
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
