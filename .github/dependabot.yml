version: 2

# Version updates arrive twice a year (1 January and 1 July) as grouped pull requests for a
# human to review; nothing merges them automatically. Dependabot raises no security updates
# for terraform, and a GitHub Actions security update, if one appears, waits for a human like
# every other update.
updates:
  - package-ecosystem: terraform
    directories:
      - /modules/cloudflare/auth
      - /modules/cloudflare/dns
      - /modules/cloudflare/redirect
      - /modules/hetzner/firewall
      - /modules/hetzner/network
      - /modules/hetzner/object-storage
      - /modules/hetzner/server-stateful
      - /modules/hetzner/server-stateless
    schedule:
      interval: semiannually
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: semiannually
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
